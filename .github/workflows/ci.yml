name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: youtube_db
          POSTGRES_USER: youtube_user
          POSTGRES_PASSWORD: youtube_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django Deployment Security
        working-directory: ./backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-50-characters-long-safe-2026!
          DJANGO_DEBUG: "False"
          DB_NAME: youtube_db
          DB_USER: youtube_user
          DB_PASSWORD: youtube_test_pass
          DB_HOST: localhost
          DB_PORT: "5432"
        run: |
          python manage.py check --deploy

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-50-characters-long-safe-2026!
          DJANGO_DEBUG: "True"
          DB_NAME: youtube_db
          DB_USER: youtube_user
          DB_PASSWORD: youtube_test_pass
          DB_HOST: localhost
          DB_PORT: "5432"
        run: |
          python manage.py test apps

  frontend-ci:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Run Production TypeScript Build
        working-directory: ./frontend
        run: npm run build
