user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Mijoz yuborgan X-Forwarded-For ga ISHONMAYMIZ: $proxy_add_x_forwarded_for uni
    # saqlab qolardi va DRF throttle kaliti mijoz nazoratidagi qiymatga aylanardi
    # (limitni cheksiz chetlab o'tish). Cloudflare ortida haqiqiy IP CF-Connecting-IP da.
    # Tashqaridan (Cloudflare tunnel orqali) kelganini aniqlaydi
    map $http_cf_connecting_ip $via_cloudflare {
        default  1;
        ""       0;
    }
    map $host $via_tunnel_host {
        default                     0;
        "~*\.trycloudflare\.com$"   1;
    }
    map $via_cloudflare$via_tunnel_host $is_external {
        default  1;
        "00"     0;
    }

    map $http_cf_connecting_ip $real_client_ip {
        default   $http_cf_connecting_ip;
        ""        $remote_addr;
    }

    upstream backend_server {
        server backend:8000;
    }

    upstream frontend_server {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        # Freym himoyasi: CSP frame-ancestors X-Frame-Options'dan ustun turadi,
        # shuning uchun Telegram Mini App ishlaydi, boshqa saytlar esa
        # sahifani iframe'ga solib clickjacking qila olmaydi.
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            access_log off;
        }

        # Media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
        }

        # Django admin — FAQAT lokal tarmoq va docker ichidan.
        # Ilgari /api/ bilan birga tunneldan ochiq edi: admin foydalanuvchi nomi
        # ma'lum, DRF throttle esa admin panelga taalluqli emas (cheksiz brute-force).
        location ~ ^/admin/ {
            # Tunnel orqali kelgan har qanday so'rov rad etiladi.
            # (IP bo'yicha filtr yetarli emas: cloudflared host'da ishlab,
            #  nginx'ga docker tarmog'idan "ichki" IP bilan keladi.)
            if ($is_external) {
                return 403;
            }

            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $real_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API routes
        location ~ ^/api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $real_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $real_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
